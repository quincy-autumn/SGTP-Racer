#OCP（Optimal Control Problem）就是 MPPI 算法的具体数学参数。Algorithm Formulation:算法制定环节


num_samples: 128                  #每次采样 128 条轨迹!!!!!!!!!
N: 12                             #预测未来 12 个时间步，总时长 1.2 秒 !!!!!!!!
horizon: 1.2                      #预测未来 12 个时间步，总时长 1.2 秒
v_max: 10.0                       #最大车速
a_max: 3.0                        #最大加速度
lambda_: 2.9896380083439036       #温度参数       !!!!!!!!
#λ 很大时算法不相信任何一条轨迹是完美的，它会把最好的轨迹和最差的轨迹按比例平均起来。
#λ 很小时算法极度偏执，几乎完全把权重集中在那一条代价最小的轨迹上。完全遵照最完美的那条线走。但如果环境有一点噪声扰动，它可能会因为过于死板而直接撞车。
sigma:                            #高斯采样噪声标准差σa, σδ       !!!!!!!!
- 0.33544330947141326
- 0.02488809269378376
cost_weights:                     #基础跟踪代价C（track）
  opp_cost_weight: 4.0
  running:
    track: 60.0                    #横向偏差惩罚——Q矩阵________存疑，为什么源代码中写的是60这里是4
    heading: 47.75191760372449    #航向角惩罚——Q矩阵
    speed: 39.47753257823394      #速度惩罚——Q矩阵
    u_accel: 8.430877961556272    #控制量惩罚——u[a,δ]——R矩阵
    u_steer: 20.0                 
    du_accel: 1.0                 #平滑度惩罚——控制惩罚——S矩阵
    du_steer: 19.2629524343753

#MPPI_采样——推演——加权——更新
#先定预测步数N保证规划能完整覆盖整个决策过程
#再调sigma，太小走不出局部最优，太大会轨迹发散
#校准lambda,让ESS稳定在K的20~60%，太小变成随机贪心，太小决策迟缓糊成一团
